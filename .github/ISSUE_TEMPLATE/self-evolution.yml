name: 原則の自己進化
description: principles プラグインの原則に反映すべきことを提案する(起票すると自動で PR が作られ、マージされる)
labels: ["self-evolution"]
body:
  - type: textarea
    id: trigger
    attributes:
      label: きっかけ
      description: 何をしていて、何が起きたか。原則のどこが足りなかった/不合理だったか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 原則をどう変えるか。追加・修正・統合・削除のどれか。可能なら変更後の文面
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由
      description: なぜその変更が目的に照らして合理的か。他の原則との関係
    validations:
      required: true
