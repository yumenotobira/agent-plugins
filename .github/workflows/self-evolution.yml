name: Self-evolution

# Validate every PR. For self-evolution PRs opened by the scheduled task,
# merge automatically once validation passes and the change stays in scope.
#
# The merge uses GITHUB_TOKEN, so it does not trigger bump-versions.yml;
# self-evolution PRs bump the plugin version themselves.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-evolution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for dir in plugins/*/; do
            claude plugin validate "$dir"
          done

  merge:
    needs: validate
    if: >-
      github.event.pull_request.user.login == 'yumenotobira' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      contains(github.event.pull_request.labels.*.name, 'self-evolution')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check changed paths
        run: |
          git diff --name-only origin/main...HEAD > changed.txt
          cat changed.txt
          if grep -vE '^(plugins/principles/|\.claude/skills/evolving/)' changed.txt; then
            echo "::error::Changes outside the self-evolution scope. Leaving this PR for human review."
            exit 1
          fi

      - name: Check version bump
        run: |
          if grep -q '^plugins/principles/' changed.txt; then
            manifest=plugins/principles/.claude-plugin/plugin.json
            base=$(git show "origin/main:$manifest" | jq -r '.version // ""')
            head=$(jq -r '.version // ""' "$manifest")
            echo "version: $base -> $head"
            if [ "$base" = "$head" ]; then
              echo "::error::plugins/principles changed but its version was not bumped."
              exit 1
            fi
          fi

      - name: Merge
        run: gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"
