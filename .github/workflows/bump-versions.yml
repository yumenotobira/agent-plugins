name: Bump plugin versions

# When a PR touching plugins/ is merged into main, bump the version of each
# changed plugin and push the result to main.
# Bump level: patch by default; label the PR "release:minor" or "release:major" to override.

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ["plugins/**"]

permissions:
  contents: write

concurrency:
  group: bump-versions
  cancel-in-progress: false

jobs:
  bump:
    # self-evolution PRs bump their own version (see self-evolution.yml).
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'self-evolution')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide bump level
        id: level
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          level=patch
          if echo "$LABELS" | grep -q '"release:major"'; then level=major
          elif echo "$LABELS" | grep -q '"release:minor"'; then level=minor
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Bump versions
        id: bump
        run: |
          python3 scripts/bump_versions.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.merge_commit_sha }}" \
            --level "${{ steps.level.outputs.level }}"

      - name: Commit and push
        if: steps.bump.outputs.bumped != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/*/.claude-plugin/plugin.json
          git commit -m "chore: bump plugin versions (${{ steps.bump.outputs.bumped }}) [#${{ github.event.pull_request.number }}]"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
